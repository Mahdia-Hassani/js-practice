<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Ticket Pricing</title>
  </head>
  <body>
    <h1>Movie Ticket Pricing Calculator</h1>
    <label>Age:</label>
    <input type="number" id="age" placeholder="Enter your age" />

    <br /><br />

    <label>
      <input type="checkbox" id="student" />
      Student
    </label>

    <br />

    <label>
      <input type="checkbox" id="senior" />
      Senior
    </label>

    <br /><br />

    <button id="calculate">Calculate Price</button>

    <p id="result"></p>

    <script src="script.js"></script>
  </body>
</html>
