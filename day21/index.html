<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Checker</title>
  </head>
  <body>
    <h1>Student Checker</h1>
    <h2>Age Checker</h2>
    <input type="number" id="age" placeholder="Enter your age" />
    <button id="checkAge">Check Age</button>
    <p id="ageResult"></p>

    <h2>Number Checker</h2>
    <input type="number" id="number" placeholder="Enter a number" />
    <button id="checkNumber">Check Number</button>
    <p id="numberResult"></p>

    <h2>Grade Checker</h2>
    <input type="number" id="score" placeholder="Enter score" />
    <button id="checkGrade">Check Grade</button>
    <p id="gradeResult"></p>

    <h2>Even or Odd</h2>
    <input type="number" id="evenOddNumber" placeholder="Enter a number" />
    <button id="checkEvenOdd">Check Number</button>
    <p id="evenOddResult"></p>

    <h2>Login Checker</h2>
    <input type="text" id="username" placeholder="Username" />
    <input type="password" id="password" placeholder="Password" />
    <button id="loginButton">Login</button>
    <p id="loginResult"></p>

    <h2>Adult or Minor</h2>
    <input type="number" id="ternaryAge" placeholder="Enter your age" />
    <button id="checkTernary">Check Age</button>
    <p id="ternaryResult"></p>

    <h2>Access Checker</h2>
    <input type="number" id="accessAge" placeholder="Enter your age" />

    <label>
      <input type="checkbox" id="hasID" />
      I have an ID
    </label>

    <button id="checkAccess">Check Access</button>
    <p id="accessResult"></p>

    <h2>Student Result Checker</h2>

    <form id="studentForm">
      <input type="text" id="studentName" placeholder="Student name" />
      <input type="number" id="studentScore" placeholder="Score" />
      <button type="submit">Check Result</button>
    </form>

    <p id="studentResult"></p>

    <script src="script.js"></script>
  </body>
</html>
